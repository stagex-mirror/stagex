name: "Pull Request"
about: "Submit a pull request"
ref: "main"
body:
- type: textarea
  id: description
  attributes:
    label: What changes does this PR introduce?
  validation:
    required: false
- type: textarea
  id: what-modifies
  attributes:
    label: What package does this PR add or modify, if any?
  validations:
    required: false
- type: textarea
  id: digests
  attributes:
    label: Package digests
    description: Please copy and paste the digests
    placeholder: "$ make digests | xclip -sel c"
    render: shell
- type: checkboxes
  id: reproduce
  attributes:
    label: If modifying packages, have the packages been reproduced locally?
    description: This is optional, but helps reduce maintenance burden.
    options:
    - label: I have built this package twice and confirmed it reproduces.
      required: false
- type: checkboxes
  id: tracking
  attributes:
    label: Package Tracking
    description: |
      If this PR introduces a new package, it must be tracked on [release-monitoring.org](https://release-monitoring.org/) (Anitya) to ensure automated update notifications.
    options:
      - label: This PR does not add a new package.
        required: false
      - label: The new package is already mapped on Anitya / I will map it immediately after the merge.
        required: false
