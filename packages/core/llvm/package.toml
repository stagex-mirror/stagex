[package]
name = "llvm"
version = "22.1.5"
description = "Collection of modular and reusable compiler and toolchain technologies"
license = "Apache-2.0 WITH LLVM-exception"
website = "https://llvm.org"
#HACK: omitting clang-tools-extra and clang-tools-extra-static due to build issues
subpackages = ["llvm","llvm-libgcc","llvm-binutils","clang","clang-rt-devel","clang-devel-static","clang-devel","clang-analyzer","clang-libs","clang-cpp-libs","mlir","mlir-libs","mlir-devel","mlir-devel-static","libunwind","libunwind-devel","libunwind-devel-static","libcxx","libcxx-devel","libcxx-devel-static","libcxxabi","libcxxabi-devel","libcxxabi-devel-static","llvm-libs","lld","lld-devel","llvm-linker-tools","llvm-devel","llvm-devel-static","llvm-tools","llvm-runtime","lldb","lldb-devel","lldb-devel-static","runtime-cross-x86_64","runtime-cross-aarch64"]

[sources.llvm]
hash = "7972b87b705a003ce70ab55f9f0fb495d156887cba0eb296d284731139118e2c"
file = "llvm-{version}.tar.xz"
