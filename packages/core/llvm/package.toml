[package]
name = "llvm"
version = "22.1.3"
description = "Collection of modular and reusable compiler and toolchain technologies"
license = "Apache-2.0 WITH LLVM-exception"
website = "https://llvm.org"
#HACK: omitting clang-tools-extra and clang-tools-extra-static due to build issues
subpackages = ["llvm","llvm-libgcc","llvm-binutils","clang","clang-rt-devel","clang-devel-static","clang-devel","clang-analyzer","clang-libs","clang-cpp-libs","mlir","mlir-libs","mlir-devel","mlir-devel-static","libunwind","libunwind-devel","libunwind-devel-static","libcxx","libcxx-devel","libcxx-devel-static","libcxxabi","libcxxabi-devel","libcxxabi-devel-static","llvm-libs","lld","lld-devel","llvm-linker-tools","llvm-devel","llvm-devel-static","llvm-tools","llvm-runtime","lldb","lldb-devel","lldb-devel-static"]

[sources.llvm]
hash = "2488c33a959eafba1c44f253e5bbe7ac958eb53fa626298a3a5f4b87373767cd"
file = "llvm-{version}.tar.xz"
mirrors = [ "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/llvm-project-{version}.src.tar.xz",]
