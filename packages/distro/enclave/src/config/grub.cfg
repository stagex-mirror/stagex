set timeout=2

# --- SEV-SNP boot progress marker (serial console is dead on SNP) ---
# The ESP (FAT) persists across hangs and poweroffs. save_env writes a GRUB env
# block to /boot/env on each phase; reading it back after a hang tells us how
# far the boot got: OVMF -> GRUB config (grubmark=cfg) -> GRUB menuentry
# (grubmark=entry) -> kernel. The env file is pre-created at build time.
# Set root explicitly so the absolute /boot/env path resolves to the ESP.
set root=(hd0,gpt1)
set grubmark=cfg
save_env --file /boot/env grubmark

menuentry "Linux Stagex" {
    set grubmark=entry
    save_env --file /boot/env grubmark
    echo "Loading kernel..."
    linux /boot/vmlinuz ro root=/dev/xvda2 rootfstype=erofs rootwait init=/init console=tty0 console=ttyS0,115200n8 earlyprintk=ttyS0,115200 debug loglevel=8 net.ifnames=0 biosdevname=0 modprobe.blacklist=bonding hostname=stagex
    initrd /boot/initramfs
    echo "Booting..."
}
