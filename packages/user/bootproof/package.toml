[package]
name = "bootproof"
version = "5edced34692a6d91bf0efb4c4e273ea834d02107"
description = "Rust remote attestation: the shared library (attest engine, dmext LUKS unseal, collect server loop, bootproof protocol) + a narrow CLI (tpm-probe / attest / verify). SEV-SNP + TPM2 in-process (sev crate), zero OS-exec, identity self-heal."
license = "MIT OR Apache-2.0"
website = "https://codeberg.org/lrvick/bootproof"

[sources.bootproof]
hash = "38846ceacc8bb92c7c599fa7206af9dd936e7d6e76cf00f2d97a047d070ed415"
format = "tar.gz"
file = "bootproof-{version}.{format}"
# Re-anchor (combined re-gate, operator auth 2026-11-08): the hash is the
# git-archive CONSENSUS (three-way cross-host, blessed form: git -c
# tar.umask=0002 archive --format=tar.gz --prefix=bootproof/ <tip>), NOT
# codeberg stream bytes; the archive is seeded into fetch/user/bootproof/
# by the STEP 0 seed producer (assert-before-build), so the forge never
# enters the trust path and a clean host verifies from source.
mirrors = ["https://codeberg.org/lrvick/bootproof/archive/{version}.{format}"]
