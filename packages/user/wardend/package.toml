[package]
name = "wardend"
# Pinned to commit 996c603 (aws-v0313 = v0.3.11 + bastiond SNP boot fix) of
# https://codeberg.org/lrvick/wardend: the containerized unit supervisor
# stack that replaces execd + the sysnet/sshdt shell in the wardend enclave
# topology. v0.3.12 = v0.3.11 + the posternd shell-free bundle (the built-ins-
# only ssh surface): the bundle ships exactly ONE executable (posternd) + the
# shared musl runtime — no busybox, no /bin/sh. status is a pure-Rust /proc
# report (posternd status), and an arbitrary exec / interactive shell is
# DECLINED by the daemon (posternd decline, exit 127) — there is nothing else
# in the sandbox to run. v0.3.11 = the C1 ACME CSR fix: build_csr now emits a
# valid RFC 2986 PKCS#10 request so a real ACME CA (Boulder) can parse it
# (issuance was structurally impossible before; the mock accepted any
# payload). v0.3.10 is the logging release: the
# warden puts fd 1 + fd 2 (the serial console) in O_NONBLOCK at boot so a full
# 16550 buffer no longer wedges the single-threaded log pump (the console froze
# mid-line AND the ring stopped growing ~30s post-boot), and the scribe ring
# bounds a per-unit window alongside the global bound so the gvisor --debug
# flood cannot evict a quiet unit's lines out of `logs -u <unit>`. This package builds EVERY binary of the wardend workspace (the
# single build site for the repo; the separate user-demit package is
# retired). The core daemons:
#   wardend   (bin `wardend`)  — the unit supervisor (regentd spawns it);
#                                loads /etc/wardend/units/*.hcl, resolves the
#                                depends DAG, runs the gvisor + container
#                                moats. Built with --features gvisor,container
#                                (the default is container-only; the gvisor
#                                moat is what runs the netstack sandbox).
#   regent    (bin `regentd`)  — PID 1 after demit: seeds /root/.ssh from the
#                                baked key, then spawns wardend. Also builds
#                                wardend-watchdog + wardend-xdparm +
#                                wardend-xdpgone (the data-plane backstops).
#   postern   (bin `posternd`) — the in-process SSH daemon (russh), a netstack
#                                co-tenant; pubkey-only, fail-closed.
#   bastion   (bin `bastiond`) — the netstack sandbox init (the wire owner:
#                                LLA bootstrap + DHCP + the :22->UDS relay +
#                                the posternd supervisor; the wardend-bridge
#                                crate's `bridge` binary was deleted — its
#                                wire logic was folded into bastiond).
#   xattach   (bin `xattach`)  — the kernel-side XDP attach oneshot (netlink
#                                uplink resolve, channel collapse to 1, bpffs
#                                mount, exec of the prebuilt xdp_loader).
#   demit     (bin `demit`)    — the initramfs init (no_std/nolibc, static;
#                                the UKI .initrd /init — the distro COPYs it
#                                from this image; the user-demit package is
#                                retired, this is the single build site).
#   bailiffd  (bin `bailiffd`) — the reserved k8s-worker adapter (shipped
#                                with the fleet; no unit file references it
#                                yet).
# All are musl-dynamic (the shared musl runtime is core-musl +
# core-libunwind, already in the rootfs); only demit is static (it is the
# initramfs init — built in this SAME pass with the nolibc target spec, the
# separate user-demit package is retired).
version = "4f5f66258cc3b7b6474506ff795b70e49de76e82"
description = "wardend unit supervisor + regentd + posternd (russh SSH) + xattach (XDP attach) + seald (evidence daemon, in-sandbox co-tenant) + scribed (log ring) + keepd (LUKS) + demit (initramfs init) + wardenctl + bailiffd"
license = "MIT OR Apache-2.0"
website = "https://codeberg.org/lrvick/wardend"

[sources.wardend]
hash = "61a834f01e655429c885196e2a70bb30fcebae91c0dcddd84bb234506ebcc35c"
format = "tar.gz"
file = "wardend-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/wardend/archive/{version}.{format}"]

# bootproof: the path dep for the seal + wardenctl crates (the bootproof
# generic engine + the bootproof-platform-wardend verifier). The wardend
# archive is FLAT in the build (the workspace root at /), so the seal +
# wardenctl crates' path dep `../../../bootproof/crates/<crate>` resolves to
# `/bootproof/crates/<crate>`. This source drops the bootproof archive into
# the same build context (fetch/user/wardend); the Containerfile extracts it
# to /bootproof. The archive is pre-seeded in fetch/user/wardend/ so the
# build uses it without re-fetching (the lrvick mirror 404s some commits).
[sources.bootproof]
version = "6d196ad3018edda9b082e8b314c1463a09703953"
hash = "97247cc86076fda1631171aad2e3e4abed326e98bf0639927868f26c9b378c66"
format = "tar.gz"
file = "bootproof-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/bootproof/archive/{version}.{format}"]
