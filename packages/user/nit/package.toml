[package]
name = "nit"
# Pinned to a commit of https://codeberg.org/lrvick/nit (branch
# spawn-supervisor): the unikernel init that both loop-mounts the erofs
# system image and runs as PID 1 (inittab sysinit/respawn/shutdown).
# Fetched as a source archive from the codeberg.org commit.
version = "7ee07e3"
description = "Rust unikernel init: erofs unpack + pivot, then PID-1 supervision (replaces klibc initramfs init and busybox init)"
license = "MIT"
website = "https://codeberg.org/lrvick/nit"

[sources.nit]
hash = "e566c5f2d73d58d9830ab7b148cc153bde60689dc48ca79d489a956bae56b870"
format = "tar.gz"
file = "nit-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/nit/archive/{version}.{format}"]
