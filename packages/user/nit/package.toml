[package]
name = "nit"
# Pinned to main of https://codeberg.org/lrvick/nit: the unikernel init that
# loop-mounts the erofs system image, sets up the runtime mounts, then execs
# its target (`init.target=`) as the new PID 1.
#
# This pin is the 0.9.0 zero-dependency rebuild (main, squashed from
# rustix-vendor; the pre-squash line is kept on `backup/main-pre-squash`):
# no_std, no libc, no crates.io -- first-party raw syscall shims in
# src/system/raw.rs (a closed ~21-surface set, ground-truth-pinned against
# the kernel's own source), fail-closed cred handling, and an O_CLOEXEC exec
# hand-off. Note the command-line keys are `init.*` (init.target/unpack/
# uid/gid/caps); `nit.mode=` and `nit.progress=` no longer exist. The
# archive is the codeberg full-SHA archive, byte-verified against the hash
# below.
version = "12671964293636ffcd1912f2780cebf38137f461"
description = "Rust unikernel init: erofs unpack + pivot, then boot-to-execve hand-off (replaces klibc initramfs init and busybox init)"
license = "MIT"
website = "https://codeberg.org/lrvick/nit"

[sources.nit]
hash = "dfe799c21652008f95a822267dd4387991a3fc310be8eee386acfa1d7aee99c9"
format = "tar.gz"
file = "nit-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/nit/archive/{version}.{format}"]
