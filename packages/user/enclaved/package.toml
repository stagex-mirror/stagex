[package]
name = "enclaved"
version = "20260907.0"
description = "The StageX enclave host daemon: the single no-arg daemon that owns the attestation hardware (SEV-SNP + TPM2), the bootproof evidence socket, PCR11 rootfs measurement, cloud user-data (IMDS / config-drive), unprivileged user setup, and the LUKS /home volume. No args, no shell. Also carries bootproofd, the sole HTTP face over the enclaved Unix socket."
license = "MIT OR Apache-2.0"
website = "https://codeberg.org/lrvick/enclaved"

[sources.enclaved]
# eb42c31: measure: O_RDWR TPM open (EBADF fix) + tpmrm0-first + fix the raw
# TPM2 wire protocol (response header tag|size|code u32, TPML_PCR_SELECTION
# request, TPML_PCR_VALUES response) + TPM2_Startup cc 0x0144 (was 0x0180)
# + RC_INITIALIZE check 0x0100 (was 0x0001) + surface the response RC
# + command tag TPM_ST_NO_SESSIONS 0x8001 (was 0x0001 -> TPM_RC_BAD_TAG 0x0096
#   on every command; the "silent non-zero RC")
# + DEBUG raw response-header dump (root cause found; removed in 90e007a).
# 90e007a: the wire protocol NEVER actually worked against a real TPM.
#   PCR_Extend cc 0x0184 was TPM2_CC_PCR_Reset (correct: 0x0182);
#   PCR_Read cc 0x0187 was TPM2_CC_PCR_SetAuthPolicy (correct: 0x017E);
#   build_pcr_extend was missing the TPM2B_DATA u16 bufferSize prefix
#   (46 -> 48). The guest's rc=0x0184 response was TPM_RC_H (invalid
#   command handle area) — the TPM choking on the malformed command,
#   not a tpmrm/device issue. parse_pcr_read now matches the spec
#   (updateCounter | selection echo | TPM2B_DIGEST value; no per-value
#   handle), cross-checked against the proven-good bootproof-tpm
#   reference parser that produced every BOUND verdict.
# 047cdbb: NO_SESSIONS TPM2_PCR_Extend (54 bytes, tag 0x8001) — PREMISE
#   REFUTED by the guest: libtpms returned 0x00000125 (TPM_RC_AUTH_MISSING)
#   on the 54-byte command. The v-bit reading was the trap: v governs
#   non-empty auth *value*, while the chandle flag still requires a session
#   handle in the session area. The kernel opens a session for PCR_Extend
#   too (tpm2-cmd.c tpm2_pcr_extend -> tpm2_start_auth_session, salted
#   HMAC); the "kernel sends it bare" read was the disable_pcr_integrity
#   path only.
# e8f325a: TPM_RS_PW (0x40000009) password session, empty auth — 67 bytes,
#   tag 0x8002: header | pcrHandle | authSize 9 | (PW handle | empty
#   nonceCaller | attrs 0 | empty auth) | TPML_DIGEST_VALUES. A PCR's auth
#   value is empty, so empty==empty passes libtpms CheckPWAuthSession.
# e11af0f: dropped the spurious 2-byte TPM2B_DIGEST size field before the
#   raw digest (TPML_DIGEST_VALUES per-entry is TPMT_HA = hashAlg + raw
#   digest, no size field — kernel tpm2-cmd.c:208-214 and libtpms
#   TPMU_HA_Unmarshal both confirmed). The extra 2 bytes shifted the
#   fixed 32-byte digest read -> TPM_RC_SIZE. 67 -> 65 bytes.
# bc4acdd: spec: container name= / online flags + named link lines
#   (grammar): the N-container fleet grammar (container <ref> [sha256=…]
#   [name=…] [online] [ports=…] [link=…] + link <name> containers=…
#   [port=…]); names unique at parse (shadowing refused, fail closed).
# f7c37a2: fleet: real runsc sandbox units, bundles, link dirs, execd
#   reload: UNITS_D corrected to /etc/execd/units/units.d (execd's actual
#   fleet dir); one shell supervisor unit per container (create -> start
#   -> bounded runsc list keep-alive, v5 non-blocking poll pattern, no
#   wait/timeout on a runsc child); bundle config.json from the
#   re-verified OCI config; kernel-side link dirs created before the
#   units; execd reload over the unix ctl socket (fail-open).
# 40d1cc1: spec: additive advisory report fields (name/online/links);
#   the daemon keeps re-parsing its own user-data (source of truth).
# 740d771: oci: store the manifest in pull() (daemon re-derivation anchor)
#   - the live boot fail-closed on 'store: read <manifest>: No such
#   file' because pull() stored config+layers but not the manifest the
#   fleet step re-derives from; the 101 green tests masked it (the test
#   helper stored the manifest by hand).
# 602d92f: fleet: report poll 120s -> 600s (enclavectl's in-netstack pull
#   has no hard deadline; the drop can land minutes after boot) + a
#   fail-open timeout message that names the bound and posture.
# 41bb1d1: fleet: write units to the writable /run fleet dir (execd
#   EXECD_FLEET_DIR) — UNITS_D /etc/execd/units/units.d ->
#   /run/execd/units.d. The live green-bar boot (8b602bc3) proved the
#   store-verify + report path fixed, then EROFS'd: /etc is a read-only
#   erofs, and execd read the fleet dir as config_dir/units.d (a sibling),
#   never the inside-units path enclaved wrote. The fleet dir is now
#   decoupled from the RO config dir (maps to the trust model: static
#   units immutable/RO, fleet units runtime-generated + verified);
#   requires the execd 991fb3b pin (get_units(dir, fleet_dir)).
# 42774d3: fleet: quote the generated unit script's F={flags} assignment.
#   The 659dee0c boot fixed the env crux (fleet: ok reloaded) but both
#   container units looped on create: the child stderr carried
#   'command not found: --overlay2=none' — the UNQUOTED F={flags} is a
#   POSIX command-prefix assignment (F keeps only the first word, the
#   rest is attempted as a command), so runsc ran BARE. Now F is one
#   quoted value; runsc create/start stderr is teed to
#   /run/enclaved/runsc-<name>.err; the create rc echo prints the real
#   captured $? (was single-quoted -> literal '?').
# f998fee: fleet: --log on the unit's runsc create. Boot #5 (66ad54cb)
#   proved the quoting fix (all six flags reach runsc) but create died
#   at sandbox start: the client sync pipe EOFed — the sentry (found at
#   /usr/bin/gvisor-bin/gvisor_sentry, static, correct per gvisor's
#   resolveDir) launched and died before its sync byte, and runsc
#   discards the sentry's stdout/stderr (exec.Command default /dev/null;
#   the log fd goes to the empty conf.LogFilename). The log now lands
#   in /run/enclaved/runsc-<name>.log (rbind, netstack-readable).
# f84723a: fleet: --log is a GLOBAL flag; move it before the create
#   subcommand. Boot #6 (c6c3ee27) carried the flag in the subcommand
#   position (after create) and hit runsc's exact rejection: "failed to
#   parse flags for create: flag provided but not defined: -log". --root
#   / --network / --log are global config flags parsed before the
#   subcommand; create has its own set (--bundle, --user-log, ...). The
#   parse failure (rc=128) fired before any sentry booted, so no log was
#   created and boot #6 masked boot #5's sentry death. A root-faithful
#   local repro (root + exact guest config + the six flags) creates
#   cleanly (rc=0), so the guest death is environment-specific; the
#   log is still the missing evidence.
# 6e3b6c9: fleet: extract each bundle rootfs as a REAL dir, not a symlink.
#   Boot #7's sentry log (runsc-alpha.log) pinned BUG 6: SafeMount opened
#   the bind destination /run/enclaved/bundles/alpha/rootfs/run/links/web,
#   readlink /proc/self/fd/N resolved through the SYMLINK to
#   /run/enclaved/rootfs/alpha/run/links/web, dst != resolved ->
#   ErrSymlinkMount -> sentry died at FS setup -> client sync EOF. OCI
#   spec also forbids root.path symlinks. Root-faithful local A/B:
#   symlinked rc=128 (byte-identical message), real-dir rc=0. Now each
#   container's rootfs is extracted directly into <bundle>/rootfs (real
#   dir, self-contained bundle); the shared /run/enclaved/rootfs is gone,
#   which also gives per-container isolation.
# bd14dd1: fleet: BUG 7 -- idempotent delete --force, clean log per attempt,
#   GRACE startup counter. Boot #8 (disk 87a9a515) confirmed BUG 6 fixed
#   (real-dir rootfs, create+start succeeded, state file status running,
#   sentry pid 1833) but surfaced BUG 7: the unit poll broke on the FIRST
#   non-running read (the tight first runsc list ~0.5s after start raced the
#   sentry becoming visible-as-running) -> exit 1 -> execd restart -> the
#   restart's create hit the leftover state file (container already exists)
#   -> start hit cannot start in state stopped -> a 4037-line poison loop.
#   Fix in the container_unit template: (a) delete --force before create
#   (subcommand flag, after delete, not in $F; tolerates IsNotExist so a safe
#   no-op on a fresh boot, clears zombie/stopped/running state on a restart),
#   (b) rm -f the sentry log before --log create so the log always shows the
#   latest attempt, (c) GRACE=24 counter tolerating consecutive non-running
#   polls (24x5s=120s; resets on running, breaks at 0).
# 6e92abd: fleet: boot #10 INSTRUMENTATION ONLY (no fixes). Boot #9
#   (disk 44587545) confirmed BUG 7 fixed live but unmasked BUG 8: the
#   systrap sentry dies on the 7.2.0 guest kernel before writing its first
#   log line (0-byte --log, 0-byte .err, host runsc list never shows
#   running, audit off = no trace) -- the death is invisible. This commit
#   adds only forensics to the container_unit template: --debug in $F
#   (a GLOBAL flag, flags.go:66; the headless path sandbox.go:1317-1323
#   wires the sentry boot stdio to the client stdio = the unit 2>>.err, so
#   a Go panic/early fatal lands in .err); rm -f BOTH .log and .err per
#   attempt; audit on (runtime sysctl, no rebuild) before create so a
#   seccomp RET_KILL logs a type-1326 AUDIT_SECCOMP record with the syscall
#   number in the REAL kernel dmesg; sha256sum of the in-guest sentry+runsc
#   (A/B confound closed); a yama/audit/CET sysctl snapshot; a BOUNDED
#   sentry /proc/$PID/status poll (Seccomp/SigBlk last-seen); and kernel
#   dmesg tails at sentry death and at GRACE expiry. Every forensic line is
#   a local file read/write, never waits on a child, and is guarded so a
#   wedged forensic cannot stall the unit.
