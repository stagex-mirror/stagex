[package]
name = "enclaved"
version = "20260907.0"
description = "The StageX enclave host daemon: the single no-arg daemon that owns the attestation hardware (SEV-SNP + TPM2), the bootproof evidence socket, PCR11 rootfs measurement, cloud user-data (IMDS / config-drive), unprivileged user setup, and the LUKS /home volume. No args, no shell. Also carries bootproofd, the sole HTTP face over the enclaved Unix socket."
license = "MIT OR Apache-2.0"
website = "https://codeberg.org/lrvick/enclaved"

[sources.enclaved]
# eb42c31: measure: O_RDWR TPM open (EBADF fix) + tpmrm0-first + fix the raw
# TPM2 wire protocol (response header tag|size|code u32, TPML_PCR_SELECTION
# request, TPML_PCR_VALUES response) + TPM2_Startup cc 0x0144 (was 0x0180)
# + RC_INITIALIZE check 0x0100 (was 0x0001) + surface the response RC
# + command tag TPM_ST_NO_SESSIONS 0x8001 (was 0x0001 -> TPM_RC_BAD_TAG 0x0096
#   on every command; the "silent non-zero RC")
# + DEBUG raw response-header dump (root cause found; removed in 90e007a).
# 90e007a: the wire protocol NEVER actually worked against a real TPM.
#   PCR_Extend cc 0x0184 was TPM2_CC_PCR_Reset (correct: 0x0182);
#   PCR_Read cc 0x0187 was TPM2_CC_PCR_SetAuthPolicy (correct: 0x017E);
#   build_pcr_extend was missing the TPM2B_DATA u16 bufferSize prefix
#   (46 -> 48). The guest's rc=0x0184 response was TPM_RC_H (invalid
#   command handle area) — the TPM choking on the malformed command,
#   not a tpmrm/device issue. parse_pcr_read now matches the spec
#   (updateCounter | selection echo | TPM2B_DIGEST value; no per-value
#   handle), cross-checked against the proven-good bootproof-tpm
#   reference parser that produced every BOUND verdict.
# 047cdbb: NO_SESSIONS TPM2_PCR_Extend (54 bytes, tag 0x8001) — PREMISE
#   REFUTED by the guest: libtpms returned 0x00000125 (TPM_RC_AUTH_MISSING)
#   on the 54-byte command. The v-bit reading was the trap: v governs
#   non-empty auth *value*, while the chandle flag still requires a session
#   handle in the session area. The kernel opens a session for PCR_Extend
#   too (tpm2-cmd.c tpm2_pcr_extend -> tpm2_start_auth_session, salted
#   HMAC); the "kernel sends it bare" read was the disable_pcr_integrity
#   path only.
# e8f325a: TPM_RS_PW (0x40000009) password session, empty auth — 67 bytes,
#   tag 0x8002: header | pcrHandle | authSize 9 | (PW handle | empty
#   nonceCaller | attrs 0 | empty auth) | TPML_DIGEST_VALUES. A PCR's auth
#   value is empty, so empty==empty passes libtpms CheckPWAuthSession.
# e11af0f: dropped the spurious 2-byte TPM2B_DIGEST size field before the
#   raw digest (TPML_DIGEST_VALUES per-entry is TPMT_HA = hashAlg + raw
#   digest, no size field — kernel tpm2-cmd.c:208-214 and libtpms
#   TPMU_HA_Unmarshal both confirmed). The extra 2 bytes shifted the
#   fixed 32-byte digest read -> TPM_RC_SIZE. 67 -> 65 bytes.
# bc4acdd: spec: container name= / online flags + named link lines
#   (grammar): the N-container fleet grammar (container <ref> [sha256=…]
#   [name=…] [online] [ports=…] [link=…] + link <name> containers=…
#   [port=…]); names unique at parse (shadowing refused, fail closed).
# f7c37a2: fleet: real runsc sandbox units, bundles, link dirs, execd
#   reload: UNITS_D corrected to /etc/execd/units/units.d (execd's actual
#   fleet dir); one shell supervisor unit per container (create -> start
#   -> bounded runsc list keep-alive, v5 non-blocking poll pattern, no
#   wait/timeout on a runsc child); bundle config.json from the
#   re-verified OCI config; kernel-side link dirs created before the
#   units; execd reload over the unix ctl socket (fail-open).
# 40d1cc1: spec: additive advisory report fields (name/online/links);
#   the daemon keeps re-parsing its own user-data (source of truth).
version = "40d1cc13e7d47bbad5a5ecc6c6d98356c78e9572"
hash = "51340d66b71ed9b6b73e31f94360ee607f8788b8aa7dc3b62aab549be78ea7e5"
format = "tar.gz"
file = "enclaved-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/enclaved/archive/{version}.{format}"]

