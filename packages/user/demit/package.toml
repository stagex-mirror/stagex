[package]
name = "demit"
# Pinned to commit c8f452c (branch main) of
# https://codeberg.org/lrvick/wardend: the no_std, no_alloc, nolibc
# boot-to-execve init that replaces nit in the wardend enclave topology.
# demit is the initramfs /init: it mounts the runtime filesystems, loop-
# mounts the erofs /system, pivots onto it, then execve's init.target as the
# new PID 1 (regentd). Same `init.*` kernel-cmdline keys as nit
# (init.unpack= / init.target=), so the boot chain is a drop-in swap.
# Built from the shared `sys` syscall layer (the same no_std surface nit
# carries). The `nolibc` feature gates src/main.rs (the init binary); the
# static build links no libc, so it is the initramfs init the kernel execs
# before any rootfs exists.
version = "a644a022c0c715242d85ffc7b4173832c1992c6c"
description = "no_std/nolibc boot-to-execve init (nit replacement): erofs unpack + pivot, then execve init.target as PID 1"
license = "MIT"
website = "https://codeberg.org/lrvick/wardend"

[sources.wardend]
hash = "2a6eb2caa74485308c7ce7e434f902f3212fab3c8408a823eb7af4a67daa174f"
format = "tar.gz"
file = "wardend-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/wardend/archive/{version}.{format}"]

# bootproof: the path dep for the seal + wardenctl crates (the bootproof
# generic engine + the bootproof-platform-wardend verifier). demit itself
# does NOT depend on it, but `cargo build -p demit` loads the WHOLE
# workspace manifest (which includes src/seal -> bootproof), so the path
# dep `../../../bootproof/crates/<crate>` (which resolves to
# /bootproof/crates/<crate> in the archive extraction) must exist. Same
# archive as user-wardend.
[sources.bootproof]
version = "6d196ad3018edda9b082e8b314c1463a09703953"
hash = "97247cc86076fda1631171aad2e3e4abed326e98bf0639927868f26c9b378c66"
format = "tar.gz"
file = "bootproof-{version}.{format}"
mirrors = ["https://codeberg.org/lrvick/bootproof/archive/{version}.{format}"]
