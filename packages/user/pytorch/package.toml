[package]
name = "pytorch"
version = "2.11.0"
description = "Tensor library and dynamic neural network framework"
license = "BSD-3-Clause"
website = "https://pytorch.org"


# Upstream tag v2.11.0 resolves to commit
# 70d99e998b4955e0049d13a98d77ae1b14db1f45. GitHub source archives do not
# contain submodule contents, so every submodule enabled by this deliberately
# reduced build is supplied as a separately hashed source below.
[sources.pytorch]
hash = "52872a6bbdc42334b00051d88a92f801cfd9be730abdd2b37a2d08996f53bb29"
file = "pytorch-{version}.tar.gz"
mirrors = ["https://github.com/pytorch/pytorch/archive/refs/tags/v{version}.tar.gz"]

# PyTorch accepts setuptools >=70.1,<82 and vLLM requires setuptools <81.
# Reuse one compatible version in the exported CPU inference package stack.
[sources.pytorch-setuptools]
